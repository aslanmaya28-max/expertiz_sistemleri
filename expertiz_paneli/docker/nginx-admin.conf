# Flutter web (tek sayfa uygulama). Dis nginx (musteri_paneli/nginx.conf) HTTPS'i yapar.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Yeni surum yayinlaninca eski kod onbellekte kalmasin
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }

    location /assets/ { expires 7d; }
    location /canvaskit/ { expires 30d; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
