name: yerimebak_sistemleri
description: YerimeBak Sistemleri - Araç ekspertiz ve değerleme platformu
homepage: https://yerimebak.com
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  
  # Temel UI Bileşenleri
  cupertino_icons: ^1.0.6
  
  # Veri Depolama (ZORUNLU)
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Tarih & Saat (Admin Panel için)
  intl: ^0.20.2
  
  # Takvim
  table_calendar: ^3.0.9
  
  # State Management (ZORUNLU)
  provider: ^6.1.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Equality
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^17.0.0
  
  # Network
  http: ^1.1.0
  
  # Formlar & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Loading & Animations
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # File Picker
  file_picker: ^10.3.7

  # Image Picker - güncel düzeltmeler içerir
  image_picker: ^1.1.2

  # PDF Oluşturma
  pdf: ^3.10.7
  printing: ^5.14.2

  # Harita & Konum
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2

  # QR Kod
  qr_flutter: ^4.1.0

  # Grafikler
  fl_chart: ^1.1.1

  # Tablo ve Veri Grid
  syncfusion_flutter_datagrid: ^32.1.22
  syncfusion_flutter_charts: ^32.1.22
  syncfusion_flutter_gauges: ^32.1.22

  # Notifikasyonlar
  flutter_local_notifications: ^19.5.0

  # Güvenlik
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.3
  flutter_svg: ^2.2.3
  
  # UUID Generation (OperationIntent için ZORUNLU)
  uuid: ^4.3.3
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Kod Kalitesi
  flutter_lints: ^6.0.0
  
  # JSON Serialization
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
