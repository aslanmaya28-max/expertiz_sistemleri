name: yerimebak
description: YerimeBak Android müşteri uygulaması
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 17.0.0
  http: 1.6.0
  flutter_secure_storage: 10.0.0
  path_provider: 2.1.5
  open_filex: 4.7.0
  package_info_plus: 8.3.1
  url_launcher: 6.3.2
  intl: 0.20.2
  pub_semver: 2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
