name: yerimebak
description: YerimeBak Android müşteri uygulaması
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 17.0.0
  http: 1.6.0
  flutter_secure_storage: 10.0.0
  path_provider: 2.1.5
  open_filex: 4.7.0
  package_info_plus: 8.3.1
  url_launcher: 6.3.2
  intl: 0.20.2
  pub_semver: 2.2.0
  shared_preferences: 2.5.3
  flutter_svg: 2.2.3
  lucide_icons_flutter: 4.0.2
  share_plus: 11.1.0
  webview_flutter: 4.14.1
  in_app_purchase: 3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/marka/ikon.png
  adaptive_icon_background: '#0B4A45'
  adaptive_icon_foreground: assets/marka/sembol.png
  adaptive_icon_monochrome: assets/marka/sembol.png
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: '#F2F5F4'
  color_dark: '#0D1312'
  image: assets/marka/sembol.png
  image_dark: assets/marka/sembol.png
  android_12:
    color: '#F2F5F4'
    color_dark: '#0D1312'
    image: assets/marka/sembol.png
    image_dark: assets/marka/sembol.png
    icon_background_color: '#0B4A45'
    icon_background_color_dark: '#0B4A45'
