# YerimeBak - nginx, yalnizca API sunucusu (site ve panel Vercel'de)
#   https://api.yerimebak.com.tr  -> FastAPI (/api/v1, /health)
#   https://www.yerimebak.com.tr   -> Vercel (musteri sitesi)
#   https://admin.yerimebak.com.tr -> Vercel (Flutter admin / personel paneli)
# Sertifika (docs/CANLIYA_CIKIS.md): sh scripts/ilk_sertifika.sh <eposta> api

# Her CPU cekirdegi icin bir nginx islemi; on binlerce eszamanli baglanti
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/wasm;

    # Ekspertiz fotograflari ve kurumsal rapor PDF yuklemeleri (MEDIA_MAX_MB=15)
    client_max_body_size 16M;

    # Cloudflare arkasindaysa gercek istemci IP'si (PayTR user_ip ve hiz sinirlari icin)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/20;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Genel API: paneller 20-30 sn'de bir yeniler; ayni ofisten (tek IP) birden
    # fazla personel/admin calisabilir.
    # Mobil operatorlerde (CGNAT) cok sayida kullanici ayni IP'yi paylasabilir.
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=300r/m;
    # Sadece giris / kayit / sifre sifirlama (kaba kuvvet ve hesap acma istismari)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream backend_api {
        server app:8000;
        # Uygulamaya acik baglantilar yeniden kullanilir (her istekte yeni TCP yok)
        keepalive 64;
    }

    # Herkese acik vitrin istekleri icin kisa sureli onbellek: ayni sayfayi binlerce
    # kisi istediginde uygulamaya yalnizca bir istek gider (giris yapmis kullanicida kapali).
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m max_size=200m inactive=10m use_temp_path=off;

    server {
        listen 80;
        server_name api.yerimebak.com.tr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.yerimebak.com.tr;

        ssl_certificate /etc/letsencrypt/live/api.yerimebak.com.tr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yerimebak.com.tr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Tarayici dogrudan baglanir: $remote_addr gercek istemci IP'sidir
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|resend-verification) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/api/v1/vitrin/(vehicles|brands|models|stats|search) {
            limit_req zone=api_limit burst=150 nodelay;
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            # CORS yaniti Origin'e gore degistigi icin anahtarda Origin de var
            proxy_cache_key "$request_method|$http_origin|$request_uri";
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # (location icinde add_header ust seviyedekileri ezer; guvenlik basliklari tekrar)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
        location /api/v1/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
        location = /health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }
        location / {
            return 301 https://www.yerimebak.com.tr;
        }
    }
}
