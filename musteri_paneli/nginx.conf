# YerimeBak - nginx (yerimebak.com.tr)
# Tek sunucu modu (COMPOSE_PROFILES=tek-sunucu, NGINX_CONF=nginx.conf).
# Vercel kullaniliyorsa bunun yerine nginx-api.conf kullanilir.
#   https://www.yerimebak.com.tr    -> musteri sitesi (Next.js) + /api/v1 (FastAPI)
#   https://yerimebak.com.tr        -> www'ye yonlendirme
#   https://admin.yerimebak.com.tr  -> Flutter admin / personel paneli + /api/v1
# Sertifika tek seferde uc ad icin alinir (docs/CANLIYA_CIKIS.md):
#   certbot certonly --webroot -w /var/www/certbot -d yerimebak.com.tr -d www.yerimebak.com.tr -d admin.yerimebak.com.tr

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/wasm;

    # Ekspertiz fotograflari ve kurumsal rapor PDF yuklemeleri (MEDIA_MAX_MB=15)
    client_max_body_size 16M;

    # Cloudflare arkasindaysa gercek istemci IP'si (PayTR user_ip ve hiz sinirlari icin)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/20;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Genel API: paneller 20-30 sn'de bir yeniler; ayni ofisten (tek IP) birden
    # fazla personel/admin calisabilir.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=180r/m;
    # Sadece giris / kayit / sifre sifirlama (kaba kuvvet ve hesap acma istismari)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream backend_api {
        server app:8000;
    }
    upstream frontend {
        server frontend:3000;
    }
    upstream admin_web {
        server admin:80;
    }

    # --- HTTP -> HTTPS + Let's Encrypt dogrulamasi ------------------------
    server {
        listen 80;
        server_name yerimebak.com.tr www.yerimebak.com.tr admin.yerimebak.com.tr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- yalin alan adi -> www -------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name yerimebak.com.tr;
        ssl_certificate /etc/letsencrypt/live/yerimebak.com.tr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yerimebak.com.tr/privkey.pem;
        return 301 https://www.yerimebak.com.tr$request_uri;
    }

    # --- Musteri sitesi: https://www.yerimebak.com.tr ---------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name www.yerimebak.com.tr;

        ssl_certificate /etc/letsencrypt/live/yerimebak.com.tr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yerimebak.com.tr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # PayTR odeme formu iframe icinde acilir; sitemiz baska sitelerde iframe'lenemez
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Giris / kayit / sifre sifirlama: siki hiz siniri
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|resend-verification) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v1/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
        location = /health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
        }
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }
    }

    # --- Admin / personel paneli: https://admin.yerimebak.com.tr ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.yerimebak.com.tr;

        ssl_certificate /etc/letsencrypt/live/yerimebak.com.tr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yerimebak.com.tr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # Arama motorlarinda gorunmesin
        add_header X-Robots-Tag "noindex, nofollow" always;

        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|resend-verification) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v1/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
        location / {
            proxy_pass http://admin_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
