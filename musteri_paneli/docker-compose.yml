name: yerimebak_sistemleri

# Canli kurulum (www.yerimebak.com.tr). Varsayilan: site + panel Vercel'de,
# bu sunucuda API (api.yerimebak.com.tr) + veritabani + kazıyıcılar calisir.
# Hepsi tek sunucuda: .env'de COMPOSE_PROFILES=tek-sunucu ve NGINX_CONF=nginx.conf
#   1) .env.example -> .env kopyalayip doldurun (SECRET_KEY, sifreler, PayTR, SMTP...)
#   2) docker compose up -d --build
#   3) Ilk SSL sertifikasi: docs/CANLIYA_CIKIS.md
# Disariya yalnizca nginx (80/443) acilir; diger servisler Docker ic aginda kalir.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: yerimebak_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Bellek ayarlari sunucu boyutuna gore .env'den (varsayilanlar 4 GB RAM icin)
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    shm_size: 256m
    expose:
      - "5432"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-1G}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: yerimebak_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tek seferlik: yukleme volume'unun sahibi uygulama kullanicisi (1000) olsun.
  # (Onceki bir kurulumdan root'a ait kalan volume'larda yuklemeler basarisiz olurdu.)
  volume-init:
    image: busybox:1.36
    container_name: yerimebak_volume_init
    user: "0:0"
    volumes:
      - app_data:/app/data
    command: ["sh", "-c", "mkdir -p /app/data/media && chown -R 1000:1000 /app/data"]
    restart: "no"

  # FastAPI uygulamasi. Kaziyicilar (arabam / Borusan Next) bu konteynerin
  # icinde, admin panelinden baslatilip durdurulan alt surecler olarak calisir.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yerimebak_app
    # Tum ayarlar (PayTR, SMTP, ADMIN_SECRET_KEY, hizmet bedeli...) .env'den gelir
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MEDIA_ROOT=/app/data/media
      - HEADLESS=true
      - DOCKER_CONTAINER=1
      - TZ=Europe/Istanbul
      # Eszamanli istek kapasitesi: calisan islem sayisi x islem basina DB baglantisi
      # (toplam PG_MAX_CONNECTIONS'i asmamali)
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
    expose:
      - "8000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Fotograf ve kurumsal rapor yuklemeleri (kalici)
      - app_data:/app/data
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Kaziyici Chromium'u da bu konteynerde calisir; islem basina ~200 MB
          memory: ${APP_MEMORY_LIMIT:-2G}
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Musteri sitesi (Next.js)
  # Musteri sitesi: Vercel kullaniliyorsa calismaz (yalnizca tek sunucu modu)
  frontend:
    profiles: ["tek-sunucu"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yerimebak_frontend
    env_file:
      - .env
    environment:
      - API_BACKEND_URL=http://app:8000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Flutter admin + personel paneli (web) -> https://admin.yerimebak.com.tr
  admin:
    profiles: ["tek-sunucu"]
    build:
      context: ../expertiz_paneli
      dockerfile: Dockerfile
      args:
        YERIMEBAK_API_BASE_URL: ${ADMIN_API_BASE_URL:-https://admin.yerimebak.com.tr/api/v1}
    container_name: yerimebak_admin
    expose:
      - "80"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M

  # Gunluk PostgreSQL yedegi (pg_dump) -> ./data/backups
  backup:
    image: postgres:15-alpine
    container_name: yerimebak_backup
    environment:
      - PGHOST=postgres
      - PGDATABASE=${POSTGRES_DB:?}
      - PGUSER=${POSTGRES_USER:?}
      - PGPASSWORD=${POSTGRES_PASSWORD:?}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./data/backups:/app/backups
    entrypoint: |
      sh -c '
        echo "PostgreSQL backup service started (interval: $$BACKUP_INTERVAL sec)"
        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S)
          backup_file="/app/backups/yerimebak_$$timestamp.sql.gz"
          if pg_dump | gzip > "$$backup_file" && [ -s "$$backup_file" ]; then
            echo "Yedek olusturuldu: yerimebak_$$timestamp.sql.gz"
            find /app/backups -name "yerimebak_*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete
          else
            echo "Yedekleme BASARISIZ, tekrar denenecek"
            rm -f "$$backup_file"
          fi
          sleep $$BACKUP_INTERVAL
        done
      '
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Sunucu disi yedek: veritabani yedekleri + yuklenen fotograflar/raporlar
  # rclone ile S3 / Backblaze / Google Drive vb. bir hedefe saatte bir
  # senkronlanir. Etkinlestirmek icin .env'de RCLONE_CONFIG_OFFSITE_* ve
  # OFFSITE_PATH doldurun, sonra: docker compose --profile offsite up -d
  offsite-backup:
    image: rclone/rclone:1.68.2
    container_name: yerimebak_offsite_backup
    profiles: ["offsite"]
    env_file:
      - .env
    volumes:
      - ./data/backups:/backups/db:ro
      - app_data:/backups/app_data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        : "$${OFFSITE_PATH:?OFFSITE_PATH (or. offsite:yerimebak-yedek) tanimli degil}"
        while true; do
          rclone sync /backups/db "$$OFFSITE_PATH/db" --log-level INFO &&
          rclone sync /backups/app_data/media "$$OFFSITE_PATH/media" --log-level INFO &&
          echo "Sunucu disi yedek tamam: $$(date)" || echo "Sunucu disi yedek BASARISIZ: $$(date)"
          sleep 3600
        done
    restart: unless-stopped
    logging: *default-logging

  # Let's Encrypt: sertifika 12 saatte bir kontrol edilip suresi yaklasinca yenilenir
  certbot:
    image: certbot/certbot
    container_name: yerimebak_certbot
    volumes:
      - certbot_data:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || echo "certbot renew basarisiz"
          sleep 12h & wait $${!}
        done
    restart: unless-stopped
    logging: *default-logging

  # Nginx: disariya acilan tek servis (80/443)
  nginx:
    image: nginx:alpine
    container_name: yerimebak_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started
        required: false
      admin:
        condition: service_started
        required: false
    volumes:
      # Varsayilan: yalnizca API (site + panel Vercel'de). Tek sunucu: NGINX_CONF=nginx.conf
      - ./${NGINX_CONF:-nginx-api.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tmpfs:
      # Vitrin onbellegi (bellekte; yeniden baslatinca bosalir)
      - /var/cache/nginx:size=256m
    # Yenilenen sertifikalar icin 6 saatte bir yeniden yukle
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-512M}

# Volume adlari onceki kurulumla ayni birakildi (varsa mevcut veri korunur).
volumes:
  postgres_data:
    name: yerimebak_ai_test_postgres_data
  redis_data:
    name: yerimebak_ai_test_redis_data
  app_data:
    name: yerimebak_ai_test_app_data
  certbot_data:

networks:
  default:
    name: yerimebak_network
