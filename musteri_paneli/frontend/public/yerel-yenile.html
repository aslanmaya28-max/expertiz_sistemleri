<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YerimeBak panelini yenile</title>
<body style="font:18px system-ui;padding:40px">
<p id="durum">Test paneli yenileniyor…</p>
<script>
(async () => {
  if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
    document.getElementById('durum').textContent = 'Bu sayfa yalnızca yerel test paneli içindir.';
    return;
  }
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r => {
        const worker = r.active || r.waiting || r.installing;
        return worker && new URL(worker.scriptURL).pathname === '/sw.js';
      }).map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('yerimebak-')).map(k => caches.delete(k)));
    }
    location.replace('/ekspertiz-talebi?yenile=' + Date.now());
  } catch {
    document.getElementById('durum').textContent = 'Panel yenilenemedi. Sayfayı Ctrl+F5 ile yenileyin.';
  }
})();
</script>
</body>
</html>
